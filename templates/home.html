{% extends"layout.html" %}
{% block content %}
    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p><strong>Author:</strong> {{ post.author }}</p>
        <p><strong>Date Posted:</strong> {{ post.date_posted }}</p>
        <p>{{ post.content }}</p>
        <hr>
    {% endfor %}
{% endblock content %}
