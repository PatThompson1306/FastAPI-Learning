<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
            FastAPI - {{ title }}
        {% else %}
            FastAPI - Forgot the title!
        {% endif %}
    </title>
</head>
<body>
    <h1>Welcome to this Blog!</h1>
    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p><strong>Author:</strong> {{ post.author }}</p>
        <p><strong>Date Posted:</strong> {{ post.date_posted }}</p>
        <p>{{ post.content }}</p>
        <hr>
    {% endfor %}
</body>
</html>
